<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão Copa do Mundo 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde:#00A86B; --verde-escuro:#007A4D; --amarelo:#F5C518;
    --azul:#0D2137; --azul-medio:#163554; --azul-claro:#1E4A7A;
    --branco:#F0F4F8; --cinza:#8A9BB0; --cinza-claro:#C8D6E5;
    --laranja:#FF6B35; --vermelho:#E53935;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--azul);color:var(--branco);font-family:'Barlow',sans-serif;min-height:100vh;
    background-image:
      radial-gradient(ellipse at 20% 10%,rgba(0,168,107,.12) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 90%,rgba(245,197,24,.08) 0%,transparent 50%),
      repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,255,255,.015) 60px,rgba(255,255,255,.015) 61px),
      repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(255,255,255,.015) 60px,rgba(255,255,255,.015) 61px);
  }
 
  /* ── HEADER ── */
  header{
    background:linear-gradient(135deg,var(--verde-escuro) 0%,var(--azul-medio) 60%,var(--azul) 100%);
    border-bottom:3px solid var(--amarelo);padding:2.5rem 1.5rem 2rem;text-align:center;position:relative;overflow:hidden;
  }
  header::before{content:'';position:absolute;inset:-30px;
    background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(245,197,24,.03) 10px,rgba(245,197,24,.03) 11px);pointer-events:none;}
  .header-badge{display:inline-block;background:var(--amarelo);color:var(--azul);font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:3px;padding:4px 16px;border-radius:2px;margin-bottom:1rem;}
  header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.8rem,8vw,5.5rem);letter-spacing:4px;line-height:.9;text-shadow:0 0 40px rgba(0,168,107,.5);}
  header h1 span{color:var(--amarelo);}
  header p{margin-top:.75rem;color:var(--cinza-claro);font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;letter-spacing:1px;}
 
  /* ── STEPS ── */
  .steps-bar{display:flex;justify-content:center;padding:1.5rem 1rem 2rem;background:rgba(22,53,84,.6);border-bottom:1px solid rgba(200,214,229,.1);overflow-x:auto;gap:0;}
  .step-item{display:flex;align-items:center;cursor:pointer;}
  .step-wrap{position:relative;}
  .step-dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--cinza);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;color:var(--cinza);transition:all .3s;background:var(--azul);flex-shrink:0;}
  .step-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.62rem;color:var(--cinza);font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;transition:color .3s;}
  .step-connector{width:28px;height:2px;background:var(--cinza);opacity:.3;flex-shrink:0;}
  .step-item.active .step-dot{background:var(--verde);border-color:var(--verde);color:#fff;box-shadow:0 0 16px rgba(0,168,107,.6);}
  .step-item.active .step-label{color:var(--verde);font-weight:600;}
  .step-item.done .step-dot{background:var(--amarelo);border-color:var(--amarelo);color:var(--azul);}
  .step-item.done .step-label{color:var(--amarelo);}
  .step-item.knockout .step-dot{background:var(--laranja);border-color:var(--laranja);color:#fff;}
  .step-item.knockout .step-label{color:var(--laranja);}
 
  /* ── MAIN ── */
  main{max-width:920px;margin:0 auto;padding:2rem 1rem 4rem;}
  .page{display:none;}
  .page.active{display:block;}
 
  /* ── IDENTITY BAR ── */
  .identity-bar{
    background:var(--azul-medio);border:1px solid rgba(200,214,229,.15);border-radius:12px;
    padding:1.25rem 1.5rem;margin-bottom:2rem;display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;position:relative;
  }
  .identity-bar .saved-badge{
    position:absolute;top:10px;right:14px;font-size:.65rem;font-family:'Barlow Condensed',sans-serif;
    letter-spacing:1px;color:var(--verde);background:rgba(0,168,107,.12);border:1px solid rgba(0,168,107,.25);
    padding:2px 10px;border-radius:20px;display:none;
  }
  .identity-bar .saved-badge.visible{display:inline-block;}
  .field{flex:1;min-width:170px;}
  .field-codes{flex:2;min-width:240px;}
  label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--cinza);margin-bottom:5px;}
  input[type=text]{
    width:100%;background:rgba(13,33,55,.8);border:1.5px solid rgba(200,214,229,.2);
    border-radius:6px;padding:11px 14px;color:var(--branco);font-family:'Barlow',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s,box-shadow .2s;
  }
  input[type=text]:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(0,168,107,.15);}
  input[type=text]::placeholder{color:rgba(138,155,176,.45);}
  .codes-hint{font-size:.72rem;color:var(--cinza);margin-top:5px;}
 
  /* ── PAGE TITLE ── */
  .progress-wrap{background:rgba(200,214,229,.08);border-radius:4px;height:3px;margin-bottom:1.75rem;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--verde),var(--amarelo));border-radius:4px;transition:width .4s ease;}
  .page-title{margin-bottom:1.5rem;}
  .page-title h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
  .page-title h2 .tag{font-size:.7rem;padding:3px 10px;border-radius:3px;letter-spacing:2px;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
  .tag-group{background:var(--verde);}
  .tag-ko{background:var(--laranja);}
  .page-title p{color:var(--cinza);font-size:.88rem;margin-top:4px;}
 
  .info-box{background:rgba(0,168,107,.08);border:1px solid rgba(0,168,107,.25);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.5rem;font-size:.85rem;color:var(--cinza-claro);display:flex;gap:.75rem;align-items:flex-start;}
 
  /* ── GROUP CARD ── */
  .group-card{background:var(--azul-medio);border:1px solid rgba(200,214,229,.1);border-radius:12px;margin-bottom:1.5rem;overflow:hidden;transition:border-color .2s;}
  .group-card:hover{border-color:rgba(200,214,229,.22);}
  .group-header{padding:.9rem 1.5rem;background:linear-gradient(90deg,rgba(0,168,107,.15) 0%,transparent 60%);border-bottom:1px solid rgba(200,214,229,.08);display:flex;align-items:center;gap:1rem;cursor:pointer;user-select:none;}
  .group-letter{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--amarelo);line-height:1;min-width:28px;}
  .group-teams{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:.83rem;color:var(--cinza-claro);letter-spacing:.4px;}
  .group-progress{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;color:var(--cinza);white-space:nowrap;}
  .group-expand-icon{color:var(--cinza);font-size:1.1rem;transition:transform .3s;}
  .group-card.open .group-expand-icon{transform:rotate(180deg);}
  .games-list{display:none;padding:1rem 1.5rem 1.5rem;}
  .group-card.open .games-list{display:block;}
  .rodada-label{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--verde);margin:1rem 0 .6rem;}
  .rodada-label:first-child{margin-top:0;}
 
  /* ── GAME ROW ── */
  .game-row{
    display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;
    margin-bottom:10px;background:rgba(13,33,55,.5);border-radius:10px;
    padding:12px 16px;border:1.5px solid rgba(200,214,229,.06);transition:border-color .2s,background .2s;
  }
  .game-row:hover:not(.locked){border-color:rgba(0,168,107,.25);}
  .game-row.confirmed{border-color:rgba(0,168,107,.45);background:rgba(0,168,107,.06);}
  .game-row.locked{opacity:.55;}
  .game-row.locked-confirmed{border-color:rgba(245,197,24,.3);background:rgba(245,197,24,.04);}
 
  .game-center{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 4px;}
  .score-inputs{display:flex;align-items:center;gap:6px;}
  .score-input{
    width:46px!important;text-align:center!important;padding:8px 4px!important;
    font-size:1.2rem!important;font-family:'Bebas Neue',sans-serif!important;
    color:var(--amarelo)!important;background:rgba(13,33,55,.9)!important;
    border-color:rgba(200,214,229,.18)!important;letter-spacing:1px;border-radius:6px;
    -moz-appearance:textfield;
  }
  .score-input::-webkit-inner-spin-button,.score-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  .score-input:disabled{color:var(--cinza)!important;cursor:not-allowed;}
  .score-sep{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--cinza);line-height:1;}
 
  .deadline-tag{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:.63rem;letter-spacing:.8px;padding:2px 8px;border-radius:3px;white-space:nowrap;}
  .dl-open{background:rgba(0,168,107,.13);color:var(--verde);border:1px solid rgba(0,168,107,.28);}
  .dl-closed{background:rgba(255,107,53,.13);color:var(--laranja);border:1px solid rgba(255,107,53,.28);}
  .dl-confirmed{background:rgba(245,197,24,.13);color:var(--amarelo);border:1px solid rgba(245,197,24,.28);}
 
  .team-home{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .team-away{text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:3px;}
  .team-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem;color:var(--branco);letter-spacing:.4px;line-height:1.1;}
  .team-flag{font-size:1.35rem;line-height:1;}
 
  /* ── CONFIRM BUTTON ── */
  .btn-confirm{
    width:46px;height:46px;border-radius:8px;border:1.5px solid rgba(200,214,229,.2);
    background:rgba(13,33,55,.6);color:var(--cinza);font-size:1rem;font-weight:700;
    cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;
  }
  .btn-confirm:hover:not(:disabled){border-color:var(--verde);color:var(--verde);background:rgba(0,168,107,.12);}
  .btn-confirm.confirmed{background:var(--verde);border-color:var(--verde);color:#fff;box-shadow:0 0 14px rgba(0,168,107,.45);font-size:1.2rem;}
  .btn-confirm.locked-confirmed{background:rgba(245,197,24,.12);border-color:var(--amarelo);color:var(--amarelo);font-size:1.2rem;}
  .btn-confirm:disabled:not(.confirmed):not(.locked-confirmed){cursor:not-allowed;opacity:.4;}
  .btn-confirm-label{font-size:.55rem;letter-spacing:1.5px;margin-top:2px;display:block;}
 
  .step-item.extras .step-dot{background:var(--azul-claro);border-color:var(--azul-claro);color:#fff;}
  .step-item.extras .step-label{color:#7eb8f7;}
  .step-item.active.extras .step-dot{background:#4a9eff;border-color:#4a9eff;box-shadow:0 0 16px rgba(74,158,255,.6);}
  .step-item.active.extras .step-label{color:#4a9eff;font-weight:600;}
  .step-item.done.extras .step-dot{background:var(--amarelo);border-color:var(--amarelo);color:var(--azul);}
 
  /* ── EXTRAS PAGE ── */
  .extras-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem;}
  @media(max-width:600px){.extras-grid{grid-template-columns:1fr;}}
  .extra-card{
    background:var(--azul-medio);border:1.5px solid rgba(200,214,229,.1);border-radius:12px;
    padding:1.25rem 1.5rem;transition:border-color .2s;
  }
  .extra-card:hover{border-color:rgba(74,158,255,.3);}
  .extra-card.confirmed{border-color:rgba(0,168,107,.45);background:rgba(0,168,107,.06);}
  .extra-card.locked{opacity:.6;pointer-events:none;}
  .extra-card.locked-confirmed{border-color:rgba(245,197,24,.35);background:rgba(245,197,24,.04);}
  .extra-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;}
  .extra-card-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;color:var(--cinza-claro);}
  .extra-card-icon{font-size:1.5rem;}
  .extra-input{
    width:100%;background:rgba(13,33,55,.8);border:1.5px solid rgba(200,214,229,.18);
    border-radius:8px;padding:11px 14px;color:var(--branco);font-family:'Barlow',sans-serif;
    font-size:1rem;outline:none;transition:border-color .2s,box-shadow .2s;margin-bottom:.75rem;
  }
  .extra-input:focus{border-color:#4a9eff;box-shadow:0 0 0 3px rgba(74,158,255,.15);}
  .extra-input::placeholder{color:rgba(138,155,176,.45);}
  .extra-input:disabled{color:var(--cinza);cursor:not-allowed;background:rgba(13,33,55,.5);}
  .extra-confirm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .extra-dl-tag{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:.8px;padding:3px 9px;border-radius:3px;white-space:nowrap;}
  .extra-btn{
    min-width:52px;height:36px;border-radius:7px;border:1.5px solid rgba(200,214,229,.2);
    background:rgba(13,33,55,.6);color:var(--cinza);font-size:.85rem;font-weight:700;
    cursor:pointer;transition:all .2s;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;
    padding:0 12px;
  }
  .extra-btn:hover:not(:disabled){border-color:var(--verde);color:var(--verde);background:rgba(0,168,107,.12);}
  .extra-btn.confirmed{background:var(--verde);border-color:var(--verde);color:#fff;box-shadow:0 0 10px rgba(0,168,107,.4);}
  .extra-btn.locked-confirmed{background:rgba(245,197,24,.12);border-color:var(--amarelo);color:var(--amarelo);}
  .extra-btn:disabled:not(.confirmed):not(.locked-confirmed){opacity:.4;cursor:not-allowed;}
  .extras-deadline-banner{
    background:rgba(74,158,255,.08);border:1px solid rgba(74,158,255,.25);border-radius:8px;
    padding:.9rem 1.25rem;margin-bottom:1.5rem;display:flex;gap:.75rem;align-items:center;
    font-size:.85rem;color:var(--cinza-claro);
  }
  .ko-phase-title{
    font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;color:var(--laranja);
    margin:2rem 0 .8rem;display:flex;align-items:center;gap:.75rem;
  }
  .ko-phase-title::after{content:'';flex:1;height:1px;background:rgba(255,107,53,.2);}
  .ko-match-card{
    background:var(--azul-medio);border:1px solid rgba(200,214,229,.1);border-radius:10px;
    padding:12px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto 1fr auto;
    gap:10px;align-items:center;transition:border-color .2s;
  }
  .ko-match-card:hover:not(.locked){border-color:rgba(255,107,53,.25);}
  .ko-match-card.confirmed{border-color:rgba(0,168,107,.4);background:rgba(0,168,107,.05);}
  .ko-match-card.pending{opacity:.45;pointer-events:none;}
  .ko-match-card.pending .team-name{color:var(--cinza);font-style:italic;}
  .pending-label{
    grid-column:1/-1;text-align:center;font-family:'Barlow Condensed',sans-serif;
    font-size:.75rem;letter-spacing:1.5px;color:var(--cinza);padding:.5rem 0;
  }
 
  /* ── NAV BUTTONS ── */
  .nav-buttons{display:flex;justify-content:space-between;align-items:center;margin-top:2.5rem;gap:1rem;}
  .btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.92rem;letter-spacing:2px;text-transform:uppercase;padding:13px 28px;border-radius:6px;border:none;cursor:pointer;transition:all .2s;}
  .btn-secondary{background:transparent;color:var(--cinza);border:1.5px solid rgba(200,214,229,.2);}
  .btn-secondary:hover{color:var(--branco);border-color:rgba(200,214,229,.5);}
  .btn-primary{background:var(--verde);color:#fff;box-shadow:0 4px 18px rgba(0,168,107,.35);}
  .btn-primary:hover{background:var(--verde-escuro);transform:translateY(-1px);}
  .btn-submit{background:var(--amarelo);color:var(--azul);font-size:.95rem;padding:15px 36px;box-shadow:0 4px 18px rgba(245,197,24,.4);}
  .btn-submit:hover{background:#e0b014;transform:translateY(-1px);}
 
  /* ── TOAST ── */
  #toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--verde);color:#fff;font-family:'Barlow Condensed',sans-serif;
    font-size:.9rem;letter-spacing:1px;padding:10px 24px;border-radius:8px;
    box-shadow:0 6px 24px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    z-index:999;white-space:nowrap;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}
 
  /* ── MEUS PALPITES ── */
  .meus-palpites-btn{
    position:fixed;bottom:24px;right:24px;z-index:100;
    background:var(--amarelo);color:var(--azul);border:none;border-radius:50px;
    padding:12px 22px;font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:.9rem;letter-spacing:1.5px;cursor:pointer;
    box-shadow:0 4px 20px rgba(245,197,24,.5);transition:all .2s;
    display:flex;align-items:center;gap:8px;
  }
  .meus-palpites-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(245,197,24,.6);}
  .mp-overlay{
    display:none;position:fixed;inset:0;background:rgba(13,33,55,.97);z-index:200;
    overflow-y:auto;padding:2rem 1rem 4rem;
  }
  .mp-overlay.visible{display:block;}
  .mp-header{
    max-width:800px;margin:0 auto 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;
  }
  .mp-header h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px;color:var(--amarelo);}
  .mp-close{
    background:transparent;border:1.5px solid rgba(200,214,229,.3);color:var(--cinza);
    border-radius:6px;padding:8px 16px;font-family:'Barlow Condensed',sans-serif;
    font-size:.85rem;letter-spacing:1px;cursor:pointer;transition:all .2s;
  }
  .mp-close:hover{border-color:var(--branco);color:var(--branco);}
  .mp-content{max-width:800px;margin:0 auto;}
  .mp-section-title{
    font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;
    color:var(--verde);margin:2rem 0 .75rem;display:flex;align-items:center;gap:.75rem;
  }
  .mp-section-title::after{content:'';flex:1;height:1px;background:rgba(0,168,107,.2);}
  .mp-game{
    display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;
    background:var(--azul-medio);border-radius:8px;padding:10px 14px;margin-bottom:8px;
    border:1px solid rgba(200,214,229,.08);
  }
  .mp-game.nao-confirmado{opacity:.4;border-style:dashed;}
  .mp-game .team{font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:600;}
  .mp-game .team.home{text-align:right;}
  .mp-game .team.away{text-align:left;}
  .mp-placar{
    font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--amarelo);
    text-align:center;min-width:60px;letter-spacing:1px;
  }
  .mp-status{font-size:.7rem;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
  .mp-status.confirmado{color:var(--verde);}
  .mp-status.pendente{color:var(--cinza);}
  .mp-extra-card{
    background:var(--azul-medio);border-radius:8px;padding:12px 16px;margin-bottom:8px;
    display:flex;align-items:center;justify-content:space-between;
    border:1px solid rgba(200,214,229,.08);
  }
  .mp-extra-card.confirmado{border-color:rgba(0,168,107,.3);}
  .mp-extra-label{font-family:'Barlow Condensed',sans-serif;font-size:.8rem;letter-spacing:1px;color:var(--cinza);text-transform:uppercase;}
  .mp-extra-valor{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;color:var(--branco);}
  .mp-stats{
    background:var(--azul-medio);border-radius:10px;padding:1.25rem 1.5rem;margin-bottom:1.5rem;
    display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;text-align:center;
  }
  .mp-stat-val{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--amarelo);}
  .mp-stat-lbl{font-family:'Barlow Condensed',sans-serif;font-size:.75rem;color:var(--cinza);letter-spacing:1px;}
 
  /* ── SUCCESS ── */
  .success-screen{display:none;text-align:center;padding:4rem 2rem;}
  .success-screen.visible{display:block;}
  .success-icon{font-size:5rem;margin-bottom:1.5rem;animation:bounce .6s ease;}

// ════════════════════════════════════════════════════════════════════
//  TEMPO
// ════════════════════════════════════════════════════════════════════
function parseISOBRT(iso) {
  const [date,time] = iso.split('T');
  const [y,mo,d] = date.split('-').map(Number);
  const [h,mi] = time.split(':').map(Number);
  return new Date(Date.UTC(y,mo-1,d,h+3,mi));
}
function deadlineOf(iso) { return new Date(parseISOBRT(iso).getTime() - 2*3600*1000); }
function isLocked(iso)   { return Date.now() >= deadlineOf(iso).getTime(); }
function fmtDeadline(iso) {
  return deadlineOf(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
}

//  STEPS
// ════════════════════════════════════════════════════════════════════
function buildSteps() {
  document.getElementById('stepsBar').innerHTML = ALL_PAGES.map((p,i) => {
    const isKO    = !p.isExtras && i > GROUP_PAGES.length;
    const isExtra = !!p.isExtras;
    let cls = '';
    if(i === currentPage) cls = isExtra ? 'active extras' : isKO ? 'active knockout' : 'active';
    else if(i < currentPage) cls = isExtra ? 'done extras' : isKO ? 'done knockout' : 'done';
    else cls = isExtra ? 'extras' : isKO ? 'knockout' : '';
    const lbl = p.subtitle || p.label;
    return `
      <div class="step-item ${cls}" onclick="showPage(${i})">
        <div class="step-wrap">
          <div class="step-dot">${i<currentPage?'✓':i+1}</div>
          <div class="step-label">${lbl}</div>
        </div>
        ${i<ALL_PAGES.length-1?'<div class="step-connector"></div>':''}
      </div>`;
  }).join('');
}

function syncIdentity(pid) {
  state.name  = document.getElementById(`inp-name-${pid}`)?.value.trim() || state.name;
  const sel = document.getElementById(`inp-codes-${pid}`);
  if (sel?.value) state.codes = sel.value;
  // propaga para outros campos visíveis
  document.querySelectorAll('[id^="inp-name-"]').forEach(el => el.value = state.name);
  document.querySelectorAll('[id^="inp-codes-"]').forEach(el => { if(el.tagName==='SELECT' && state.codes) el.value = state.codes; });
  document.querySelectorAll('[id^="saved-badge-"]').forEach(el => {
    el.classList.toggle('visible', !!(state.name));
  });
  saveState();
}

function buildGroupPage(page, pi) {
  const progress = Math.round(((pi+1)/ALL_PAGES.length)*100);
  return `
  <div class="page ${pi===0?'active':''}" id="page-${pi}">
    ${identityBarHTML(pi)}
    <div class="progress-wrap"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="page-title">
      <h2>Fase de Grupos <span class="tag tag-group">${page.subtitle}</span></h2>
      <p>Confirme cada palpite com o botão ✓. Você pode alterar até 2h antes do jogo.</p>
    </div>
    <div class="info-box">
      <span>ℹ️</span>
      <div>Clique no grupo para expandir. O botão <strong>✓</strong> confirma o palpite — ele fica verde. Você pode corrigir quantas vezes quiser antes do prazo.</div>
    </div>
    ${page.groups.map(g => buildGroupCard(g)).join('')}
    ${navButtons(pi)}
  </div>`;
}
 
function buildGroupCard(g) {
  const games = ALL_GAMES.filter(x=>x.g===g);
  const teams = [...new Set(games.flatMap(x=>[x.home,x.away]))].map(t=>t.replace(/\s\S+$/,'')).join(' · ');
  const total = games.length;
  const confirmed = games.filter(x=>state.confirmed[gameId(x)]).length;
  const pct = total>0?Math.round(confirmed/total*100):0;
 
  const rounds = [1,2,3].map(r=>({r, games: games.filter(x=>x.r===r)}));
  const gamesHtml = rounds.map(round=>`
    <div class="rodada-label">🗓 Rodada ${round.r}</div>
    ${round.games.map(game => gameRowHTML(game)).join('')}
  `).join('');
 
  return `
  <div class="group-card" id="gc-${g}">
    <div class="group-header" onclick="toggleGroup('gc-${g}')">
      <div class="group-letter">${g}</div>
      <div class="group-teams">${teams}</div>
      <div class="group-progress" id="gp-${g}">${confirmed}/${total} confirmados</div>
      <div class="group-expand-icon">▾</div>
    </div>
    <div class="games-list">${gamesHtml}</div>
  </div>`;
}
 
function gameId(game) { return `${game.g}_r${game.r}_${game.home.replace(/\s\S+$/,'')}_${game.away.replace(/\s\S+$/,'')}`; }
 
function gameRowHTML(game) {
  const id   = gameId(game);
  const lk   = isLocked(game.iso);
  const conf = !!state.confirmed[id];
  const ph   = state.picks[id]?.h ?? '';
  const pa   = state.picks[id]?.a ?? '';
  const dl   = fmtDeadline(game.iso);
 
  let rowCls = '';
  let btnCls = '';
  let dlTag  = '';
  let btnDisabled = '';
 
  if(lk && conf)  { rowCls='locked-confirmed'; btnCls='locked-confirmed'; dlTag=`<span class="deadline-tag dl-confirmed">✓ Confirmado</span>`; btnDisabled='disabled'; }
  else if(lk)     { rowCls='locked';            btnCls='';                  dlTag=`<span class="deadline-tag dl-closed">🔒 Encerrado</span>`;   btnDisabled='disabled'; }
  else if(conf)   { rowCls='confirmed';          btnCls='confirmed';         dlTag=`<span class="deadline-tag dl-confirmed">✓ Até ${dl}</span>`;  }
  else            {                              btnCls='';                  dlTag=`<span class="deadline-tag dl-open">⏰ Até ${dl}</span>`; }
 
  const inputDis = (lk && conf) || lk ? 'disabled' : '';
 
  return `
  <div class="game-row ${rowCls}" id="row-${id}">
    <div class="team-home">
      <div class="team-flag">${game.home.split(' ').pop()}</div>
      <div class="team-name">${game.home.replace(/\s\S+$/,'')}</div>
    </div>
    <div class="game-center">
      <div class="score-inputs">

          placeholder="0" value="${ph}" ${inputDis}

function koMatchHTML(match) {
  const pending = !match.home || !match.away;
  const id = match.id;
  const lk = isLocked(match.iso);
  const conf = !!state.confirmed[id];
  const ph = state.picks[id]?.h ?? '';
  const pa = state.picks[id]?.a ?? '';
  const dl = fmtDeadline(match.iso);
 
  if(pending) return `
  <div class="ko-match-card pending">
    <div class="pending-label">⏳ ${match.label} — ${match.local} · Classificados ainda não definidos</div>
  </div>`;
 
  let cardCls = conf ? 'confirmed' : '';
  let btnCls  = conf ? 'confirmed' : '';
  let dlTag   = conf
    ? `<span class="deadline-tag dl-confirmed">✓ Até ${dl}</span>`
    : `<span class="deadline-tag dl-open">⏰ Até ${dl}</span>`;
  let inputDis = '';
  let btnDis  = '';
 
  if(lk) {
    cardCls = conf ? 'locked-confirmed' : 'locked';
    btnCls  = conf ? 'locked-confirmed' : '';
    dlTag   = conf ? `<span class="deadline-tag dl-confirmed">✓ Confirmado</span>` : `<span class="deadline-tag dl-closed">🔒 Encerrado</span>`;
    inputDis = 'disabled';
    btnDis   = 'disabled';
  }
 
  const hName = match.home.replace(/\s\S+$/,'');
  const aName = match.away.replace(/\s\S+$/,'');
  const hFlag = match.home.split(' ').pop();
  const aFlag = match.away.split(' ').pop();
 
  return `
  <div class="ko-match-card ${cardCls}" id="row-${id}">
    <div class="team-home">
      <div class="team-flag">${hFlag}</div>
      <div class="team-name">${hName}</div>
    </div>
    <div class="game-center">
      <div class="score-inputs">
        <input type="number" class="score-input" id="${id}-h" min="0" max="20"
          placeholder="0" value="${ph}" ${inputDis}
          oninput="onKOPickChange('${id}','${match.iso}')">
        <span class="score-sep">×</span>
        <input type="number" class="score-input" id="${id}-a" min="0" max="20"
          placeholder="0" value="${pa}" ${inputDis}
          oninput="onKOPickChange('${id}','${match.iso}')">
      </div>
      ${dlTag}
      <div style="font-size:.65rem;color:var(--cinza);margin-top:2px;font-family:'Barlow Condensed',sans-serif">${match.label} · ${match.local}</div>
    </div>
    <div class="team-away">
      <div class="team-flag">${aFlag}</div>
      <div class="team-name">${aName}</div>
    </div>
    <button class="btn-confirm ${btnCls}" id="btn-${id}"
      onclick="confirmKOPick('${id}','${match.iso}')"
      ${btnDis} title="${conf?'Alterar':'Confirmar'}">
      <span style="display:flex;flex-direction:column;align-items:center;gap:1px">
        <span style="font-size:1.1rem">${conf?'✓':'○'}</span>
        <span style="font-size:.5rem;letter-spacing:1.5px;opacity:.8">${conf?'OK':''}</span>
      </span>
    </button>
  </div>`;
}

function onPickChange(id, iso) {
  if(isLocked(iso)) return;
  const h = document.getElementById(`${id}-h`)?.value;
  const a = document.getElementById(`${id}-a`)?.value;
  state.picks[id] = { h, a };
  // desfaz confirmação ao editar
  if(state.confirmed[id]) {
    state.confirmed[id] = false;
    refreshGameRow(id, iso);
  }
  saveState();
}
 
function onKOPickChange(id, iso) {
  if(isLocked(iso)) return;
  const h = document.getElementById(`${id}-h`)?.value;
  const a = document.getElementById(`${id}-a`)?.value;
  state.picks[id] = { h, a };
  if(state.confirmed[id]) {
    state.confirmed[id] = false;
    refreshKORow(id, iso);
  }
  saveState();
}
 
function confirmPick(id, grp, iso) {
  if(isLocked(iso)) return;
  const h = document.getElementById(`${id}-h`)?.value;
  const a = document.getElementById(`${id}-a`)?.value;
  if(h===''||a==='') { showToast('⚠️ Preencha o placar antes de confirmar!','var(--laranja)'); return; }
  if(!state.name||!state.codes){ showToast('⚠️ Preencha seu nome e código antes!','var(--laranja)'); return; }
  state.picks[id] = { h, a };
  state.confirmed[id] = true;
  saveState();
  sendPick(id, { h, a });
  refreshGameRow(id, iso);
  updateGroupProgress(grp);
  showToast('✓ Palpite confirmado e enviado!');
}

function refreshGameRow(id, iso) {
  const lk   = isLocked(iso);
  const conf = !!state.confirmed[id];
  const row  = document.getElementById(`row-${id}`);
  const btn  = document.getElementById(`btn-${id}`);
  if(!row||!btn) return;
  const dl = fmtDeadline(iso);
 
  row.className = 'game-row';
  btn.disabled = false;
 
  const btnInner = (icon, label) => `<span style="display:flex;flex-direction:column;align-items:center;gap:1px"><span style="font-size:1.1rem">${icon}</span><span style="font-size:.5rem;letter-spacing:1.5px;opacity:.8">${label}</span></span>`;
  const center = row.querySelector('.game-center');
  let dlHtml = '';
 
  if(lk && conf) {
    row.classList.add('locked-confirmed');
    btn.className='btn-confirm locked-confirmed'; btn.disabled=true; btn.innerHTML=btnInner('✓','OK');
    dlHtml=`<span class="deadline-tag dl-confirmed">✓ Confirmado</span>`;
    row.querySelectorAll('.score-input').forEach(i=>i.disabled=true);
  } else if(lk) {
    row.classList.add('locked');
    btn.className='btn-confirm'; btn.disabled=true; btn.innerHTML=btnInner('○','');
    dlHtml=`<span class="deadline-tag dl-closed">🔒 Encerrado</span>`;
    row.querySelectorAll('.score-input').forEach(i=>i.disabled=true);
  } else if(conf) {
    row.classList.add('confirmed');
    btn.className='btn-confirm confirmed'; btn.innerHTML=btnInner('✓','OK');
    dlHtml=`<span class="deadline-tag dl-confirmed">✓ Até ${dl}</span>`;
  } else {
    btn.className='btn-confirm'; btn.innerHTML=btnInner('○','');
    dlHtml=`<span class="deadline-tag dl-open">⏰ Até ${dl}</span>`;
  }
  const existing = center.querySelector('.deadline-tag');
  if(existing) existing.outerHTML = dlHtml;
}
 
function refreshKORow(id, iso) {
  const lk   = isLocked(iso);
  const conf = !!state.confirmed[id];
  const row  = document.getElementById(`row-${id}`);
  const btn  = document.getElementById(`btn-${id}`);
  if(!row||!btn) return;

  const btnInner = (icon, label) => `<span style="display:flex;flex-direction:column;align-items:center;gap:1px"><span style="font-size:1.1rem">${icon}</span><span style="font-size:.5rem;letter-spacing:1.5px;opacity:.8">${label}</span></span>`;
  row.className = 'ko-match-card';
  btn.disabled = false;
  let dlHtml = '';
 
  if(lk && conf) {
    row.classList.add('locked-confirmed');
    btn.className='btn-confirm locked-confirmed'; btn.disabled=true; btn.innerHTML=btnInner('✓','OK');
    dlHtml=`<span class="deadline-tag dl-confirmed">✓ Confirmado</span>`;
    row.querySelectorAll('.score-input').forEach(i=>i.disabled=true);
  } else if(lk) {
    row.classList.add('locked');
    btn.className='btn-confirm'; btn.disabled=true; btn.innerHTML=btnInner('○','');
    dlHtml=`<span class="deadline-tag dl-closed">🔒 Encerrado</span>`;
    row.querySelectorAll('.score-input').forEach(i=>i.disabled=true);
  } else if(conf) {
    row.classList.add('confirmed');
    btn.className='btn-confirm confirmed'; btn.innerHTML=btnInner('✓','OK');
    dlHtml=`<span class="deadline-tag dl-confirmed">✓ Até ${dl}</span>`;
  } else {
    btn.className='btn-confirm'; btn.innerHTML=btnInner('○','');

  const center = row.querySelector('.game-center');

function updateGroupProgress(grp) {

  const inp  = document.getElementById(id);
  if(!card||!btn||!inp) return;
  const dl   = fmtDeadline(EXTRAS_ISO);
 
  card.className = 'extra-card';
  btn.disabled   = false;
  inp.disabled   = false;
  let dlHtml = '';
 
  if(lk && conf) {
    card.classList.add('locked-confirmed'); btn.className='extra-btn locked-confirmed';
    btn.disabled=true; inp.disabled=true; btn.textContent='✓ OK';
    dlHtml=`<span class="extra-dl-tag dl-confirmed">✓ Confirmado</span>`;
  } else if(lk) {
    card.classList.add('locked'); btn.className='extra-btn';
    btn.disabled=true; inp.disabled=true; btn.textContent='Confirmar';
    dlHtml=`<span class="extra-dl-tag dl-closed">🔒 Encerrado</span>`;
  } else if(conf) {
    card.classList.add('confirmed'); btn.className='extra-btn confirmed'; btn.textContent='✓ OK';
    dlHtml=`<span class="extra-dl-tag dl-confirmed">✓ Confirmado</span>`;
  } else {
    btn.className='extra-btn'; btn.textContent='Confirmar';
    dlHtml=`<span class="extra-dl-tag dl-open">⏰ Até ${dl}</span>`;
  }
  const row = card.querySelector('.extra-confirm-row');
  const existing = row?.querySelector('.extra-dl-tag');
  if(existing) existing.outerHTML = dlHtml;
}
 
// ════════════════════════════════════════════════════════════════════
//  MEUS PALPITES
// ════════════════════════════════════════════════════════════════════
function abrirMeusPalpites() {
  if (!state.name) { showToast('⚠️ Preencha seu nome primeiro!','var(--laranja)'); return; }
  renderMeusPalpites();
  document.getElementById('mpOverlay').classList.add('visible');
  window.scrollTo({top:0,behavior:'smooth'});
}
 
function fecharMeusPalpites() {
  document.getElementById('mpOverlay').classList.remove('visible');
}
 
function renderMeusPalpites() {
  const container = document.getElementById('mpContent');
  const totalJogos = ALL_GAMES.length;
  const confirmados = ALL_GAMES.filter(g => state.confirmed[gameId(g)]).length;
  const extrasConf = EXTRA_FIELDS.filter(f => state.confirmed[f.id]).length;
 
  let html = `
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:.9rem;color:var(--cinza-claro);margin-bottom:1.5rem;">
      <strong style="color:var(--branco)">${state.name}</strong> &nbsp;·&nbsp; Código: <strong style="color:var(--amarelo)">${state.codes || '—'}</strong>
    </div>
    <div class="mp-stats">
      <div><div class="mp-stat-val">${confirmados}</div><div class="mp-stat-lbl">Jogos confirmados</div></div>
      <div><div class="mp-stat-val">${totalJogos}</div><div class="mp-stat-lbl">Total de jogos</div></div>
      <div><div class="mp-stat-val">${extrasConf}</div><div class="mp-stat-lbl">Extras confirmados</div></div>
    </div>`;
 
  // Palpites extras
  html += `<div class="mp-section-title">⭐ Palpites Especiais</div>`;
  EXTRA_FIELDS.forEach(f => {
    const conf = !!state.confirmed[f.id];
    const val  = state.picks[f.id]?.v || '—';
    html += `
    <div class="mp-extra-card ${conf?'confirmado':''}">
      <div>
        <div class="mp-extra-label">${f.icon} ${f.title}</div>
        <div class="mp-extra-valor">${conf ? val : '—'}</div>
      </div>
      <div class="mp-status ${conf?'confirmado':'pendente'}">${conf?'✓ CONFIRMADO':'Pendente'}</div>
    </div>`;
  });
 
  // Jogos por grupo
  const GROUP_LETTERS = ['A','B','C','D','E','F','G','H','I','J','K','L'];
  GROUP_LETTERS.forEach(g => {
    const games = ALL_GAMES.filter(x => x.g === g);
    const confCount = games.filter(x => state.confirmed[gameId(x)]).length;
    html += `<div class="mp-section-title">Grupo ${g} <span style="font-size:.7rem;color:var(--cinza);font-family:'Barlow Condensed',sans-serif">${confCount}/${games.length}</span></div>`;
    games.forEach(game => {
      const id   = gameId(game);
      const conf = !!state.confirmed[id];
      const h    = state.picks[id]?.h ?? '—';
      const a    = state.picks[id]?.a ?? '—';
      const lk   = isLocked(game.iso);
      const homeShort = game.home.replace(/\s\S+$/,'');
      const awayShort = game.away.replace(/\s\S+$/,'');
      const hFlag = game.home.split(' ').pop();
      const aFlag = game.away.split(' ').pop();
      html += `
      <div class="mp-game ${conf?'':'nao-confirmado'}">
        <div class="team home">${hFlag} ${homeShort}</div>
        <div class="mp-placar">${conf ? `${h} × ${a}` : '? × ?'}</div>
        <div class="team away">${awayShort} ${aFlag}</div>
        <div class="mp-status ${conf?'confirmado':'pendente'}">${conf ? '✓' : lk ? '🔒' : '○'}</div>
      </div>`;
    });
  });
 
  // Mata-mata
  const koFases = [
    { label:'16-avos de Final', key:'r32' },
    { label:'Oitavas de Final', key:'r16' },
    { label:'Quartas de Final', key:'qf' },
    { label:'Semifinais', key:'sf' },
    { label:'3º Lugar', key:'third' },
    { label:'Final', key:'final' },
  ];
  koFases.forEach(fase => {
    const matches = KNOCKOUT_CONFIG[fase.key] || [];
    const definidos = matches.filter(m => m.home && m.away);
    if (!definidos.length) return;
    html += `<div class="mp-section-title">🏆 ${fase.label}</div>`;
    definidos.forEach(match => {
      const conf = !!state.confirmed[match.id];
      const h = state.picks[match.id]?.h ?? '—';
      const a = state.picks[match.id]?.a ?? '—';
      const hName = match.home.replace(/\s\S+$/,'');
      const aName = match.away.replace(/\s\S+$/,'');
      const hFlag = match.home.split(' ').pop();
      const aFlag = match.away.split(' ').pop();
      html += `
      <div class="mp-game ${conf?'':'nao-confirmado'}">
        <div class="team home">${hFlag} ${hName}</div>
        <div class="mp-placar">${conf ? `${h} × ${a}` : '? × ?'}</div>
        <div class="team away">${aName} ${aFlag}</div>
        <div class="mp-status ${conf?'confirmado':'pendente'}">${conf ? '✓' : '○'}</div>
      </div>`;
    });
  });
 
  container.innerHTML = html;
}
 
// ════════════════════════════════════════════════════════════════════
//  NAVEGAÇÃO
// ════════════════════════════════════════════════════════════════════
function showPage(n) {
  if(n<0||n>=ALL_PAGES.length) return;
  document.getElementById(`page-${currentPage}`)?.classList.remove('active');
  currentPage = n;
  document.getElementById(`page-${currentPage}`)?.classList.add('active');
  buildSteps();
  window.scrollTo({top:0,behavior:'smooth'});
}

//  ENVIO — dispara a cada confirmação individual
// ════════════════════════════════════════════════════════════════════
// ⚙️ Substitua pela URL do seu Google Apps Script Web App
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbweLyhR_mUB0HH0kHiKsrfC64RH0YJkI2xtKjbCi3Nr-oLlb9NbBDu1yhg3nkjSfUFfgg/exec';
 
function sendPick(pickId, pickValue) {
  if(!state.name || !state.codes) return; // silencioso se ainda não preencheu identidade
  const payload = {
    nome:      state.name,
    codigos:   state.codes,
    timestamp: new Date().toISOString(),
    pick_id:   pickId,
    pick_valor: JSON.stringify(pickValue)
  };
  fetch(SHEET_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).catch(()=>{}); // falha silenciosa — dado já está no localStorage
}
 
// ════════════════════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color || 'var(--verde)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
 
// ════════════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════════════
function init() {
  loadState();
  const container = document.getElementById('formPages');
  let html = '';
  // página 0 = extras
  html += buildExtrasPage(0);
  // páginas 1-3 = grupos
  GROUP_PAGES.forEach((p,i) => html += buildGroupPage(p, 1 + i));
  // páginas 4-8 = mata-mata
  KO_PHASES.forEach((p,i)   => html += buildKOPage(p, 1 + GROUP_PAGES.length + i));
  container.innerHTML = html;
  buildSteps();
}
 
init();
</script>
