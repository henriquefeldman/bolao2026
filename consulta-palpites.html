<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Palpites — Bolão Copa 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde:#00A86B; --verde-escuro:#007A4D; --amarelo:#F5C518;
    --azul:#0D2137; --azul-medio:#163554; --azul-claro:#1E4A7A;
    --branco:#F0F4F8; --cinza:#8A9BB0; --cinza-claro:#C8D6E5;
    --laranja:#FF6B35;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--azul);color:var(--branco);font-family:'Barlow',sans-serif;min-height:100vh;
    background-image:
      radial-gradient(ellipse at 20% 10%,rgba(0,168,107,.12) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 90%,rgba(245,197,24,.08) 0%,transparent 50%);
  }
  header{
    background:linear-gradient(135deg,var(--verde-escuro) 0%,var(--azul-medio) 60%,var(--azul) 100%);
    border-bottom:3px solid var(--amarelo);padding:2rem 1.5rem;text-align:center;
  }
  .header-badge{display:inline-block;background:var(--amarelo);color:var(--azul);font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:3px;padding:4px 16px;border-radius:2px;margin-bottom:1rem;}
  header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,7vw,4rem);letter-spacing:4px;line-height:.9;}
  header h1 span{color:var(--amarelo);}
  header p{margin-top:.75rem;color:var(--cinza-claro);font-family:'Barlow Condensed',sans-serif;font-size:1rem;letter-spacing:1px;}

  main{max-width:800px;margin:0 auto;padding:2rem 1rem 4rem;}

  .search-box{
    background:var(--azul-medio);border:1px solid rgba(200,214,229,.15);border-radius:12px;
    padding:2rem;margin-bottom:2rem;
  }
  .search-box h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;margin-bottom:1.25rem;color:var(--amarelo);}
  .search-row{display:flex;gap:12px;flex-wrap:wrap;}
  .search-row input{
    flex:1;min-width:200px;background:rgba(13,33,55,.8);border:1.5px solid rgba(200,214,229,.2);
    border-radius:6px;padding:12px 16px;color:var(--branco);font-family:'Barlow',sans-serif;
    font-size:1rem;outline:none;transition:border-color .2s;
  }
  .search-row input:focus{border-color:var(--verde);}
  .search-row input::placeholder{color:rgba(138,155,176,.45);}
  .btn-buscar{
    background:var(--verde);color:#fff;border:none;border-radius:6px;
    padding:12px 28px;font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:.95rem;letter-spacing:2px;cursor:pointer;transition:all .2s;white-space:nowrap;
  }
  .btn-buscar:hover{background:var(--verde-escuro);}
  .btn-buscar:disabled{opacity:.5;cursor:not-allowed;}

  .loading{text-align:center;padding:3rem;color:var(--cinza);font-family:'Barlow Condensed',sans-serif;font-size:1rem;letter-spacing:1px;}
  .loading span{display:inline-block;animation:spin 1s linear infinite;font-size:2rem;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .error-box{
    background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.3);border-radius:8px;
    padding:1.25rem;text-align:center;color:var(--laranja);font-family:'Barlow Condensed',sans-serif;
    font-size:1rem;letter-spacing:.5px;
  }

  .result-header{
    background:var(--azul-medio);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;
    border:1px solid rgba(0,168,107,.25);
  }
  .result-header .nome{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;color:var(--branco);}
  .result-header .cod{font-family:'Barlow Condensed',sans-serif;font-size:.85rem;letter-spacing:1px;color:var(--cinza-claro);}
  .result-header .cod span{color:var(--amarelo);font-weight:700;}
  .stats{display:flex;gap:1rem;flex-wrap:wrap;}
  .stat{text-align:center;}
  .stat-val{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--amarelo);}
  .stat-lbl{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;color:var(--cinza);letter-spacing:1px;}

  .section-title{
    font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;
    color:var(--verde);margin:1.75rem 0 .75rem;display:flex;align-items:center;gap:.75rem;
  }
  .section-title::after{content:'';flex:1;height:1px;background:rgba(0,168,107,.2);}

  .jogo-row{
    display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
    background:var(--azul-medio);border-radius:8px;padding:10px 14px;margin-bottom:8px;
    border:1px solid rgba(200,214,229,.08);
  }
  .team{font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:600;}
  .team.home{text-align:right;}
  .team.away{text-align:left;}
  .placar{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--amarelo);text-align:center;min-width:60px;}

  .extra-row{
    background:var(--azul-medio);border-radius:8px;padding:12px 16px;margin-bottom:8px;
    display:flex;align-items:center;justify-content:space-between;
    border:1px solid rgba(200,214,229,.08);
  }
  .extra-label{font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:1px;color:var(--cinza);text-transform:uppercase;}
  .extra-valor{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;color:var(--branco);}

  .btn-voltar{
    display:inline-block;margin-top:2rem;background:transparent;color:var(--cinza);
    border:1.5px solid rgba(200,214,229,.2);border-radius:6px;padding:10px 24px;
    font-family:'Barlow Condensed',sans-serif;font-size:.9rem;letter-spacing:1.5px;
    cursor:pointer;transition:all .2s;text-decoration:none;
  }
  .btn-voltar:hover{color:var(--branco);border-color:rgba(200,214,229,.5);}
</style>
</head>
<body>

<header>
  <div class="header-badge">⚽ BOLÃO OFICIAL</div>
  <h1>COPA DO MUNDO <span>2026</span></h1>
  <p>Consulta de Palpites</p>
</header>

<main>
  <div class="search-box">
    <h2>🔍 Buscar Meus Palpites</h2>
    <p style="color:var(--cinza);font-size:.9rem;margin-bottom:1.25rem;">Digite o nome exatamente como cadastrou no bolão.</p>
    <div class="search-row">
      <input type="text" id="inputNome" placeholder="Seu nome no bolão..." onkeydown="if(event.key==='Enter') buscar()">
      <button class="btn-buscar" onclick="buscar()" id="btnBuscar">Buscar</button>
    </div>
  </div>

  <div id="resultado"></div>

  <a href="https://henriquefeldman.github.io/bolao2026/" class="btn-voltar">← Voltar ao Bolão</a>
</main>

<script>
// ⚙️ URL do Apps Script
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsi7_5RsMUCSG_SzXQ2srD0daa2BhoJBTGxuEZwjBi-H5r9O98XbJM6b7zXF9_5jFQEg/exec';

// Mapeamento de campos extras
const EXTRAS_MAP = {
  extra_campeao:    '🥇 Campeão',
  extra_vice:       '🥈 Vice-Campeão',
  extra_terceiro:   '🥉 Terceiro Colocado',
  extra_quarto:     '4️⃣ Quarto Colocado',
  extra_artilheiro: '⚽ Artilheiro',
};

// Mapeamento de abas para fases
function labelFase(aba) {
  if (aba.startsWith('Grupo')) return aba;
  if (aba === '🏆 16-avos')   return '16-avos de Final';
  if (aba === '🏆 Oitavas')   return 'Oitavas de Final';
  if (aba === '🏆 Quartas')   return 'Quartas de Final';
  if (aba === '🏆 Semifinais')return 'Semifinais';
  if (aba === '🏆 Final')     return 'Final';
  return aba;
}

function formatarJogoId(id) {
  // Ex: A_r1_México_África do Sul → México x África do Sul
  const parts = id.split('_');
  if (parts.length >= 4) {
    const home = parts.slice(2, parts.length - (parts.length - 3)).join(' ') || parts[2];
    const away = parts.slice(3).join(' ');
    return `${parts[2]} × ${away}`;
  }
  return id;
}

async function buscar() {
  const nome = document.getElementById('inputNome').value.trim();
  if (!nome) { alert('Digite seu nome!'); return; }

  const btn = document.getElementById('btnBuscar');
  btn.disabled = true;
  btn.textContent = 'Buscando...';

  document.getElementById('resultado').innerHTML = `
    <div class="loading"><span>⚽</span><br><br>Buscando palpites...</div>`;

  try {
    const url = `${SCRIPT_URL}?action=consultar&nome=${encodeURIComponent(nome)}`;
    const resp = await fetch(url);
    const data = await resp.json();
    renderResultado(data, nome);
  } catch(e) {
    document.getElementById('resultado').innerHTML = `
      <div class="error-box">⚠️ Erro ao buscar. Verifique sua conexão e tente novamente.</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Buscar';
  }
}

function renderResultado(data, nomeBuscado) {
  const container = document.getElementById('resultado');

  if (!data.encontrado) {
    container.innerHTML = `
      <div class="error-box">
        ❌ Nenhum palpite encontrado para "<strong>${nomeBuscado}</strong>".<br>
        <span style="font-size:.85rem;opacity:.8">Verifique se o nome está exatamente igual ao cadastrado.</span>
      </div>`;
    return;
  }

  // Agrupa jogos por fase
  const porFase = {};
  data.jogos.forEach(j => {
    const fase = labelFase(j.aba);
    if (!porFase[fase]) porFase[fase] = [];
    porFase[fase].push(j);
  });

  let html = `
  <div class="result-header">
    <div>
      <div class="nome">${data.nome}</div>
      <div class="cod">Grupo: <span>${data.codigos || '—'}</span></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-val">${data.jogos.length}</div><div class="stat-lbl">Jogos</div></div>
      <div class="stat"><div class="stat-val">${data.extras.length}</div><div class="stat-lbl">Extras</div></div>
    </div>
  </div>`;

  // Extras
  if (data.extras.length > 0) {
    html += `<div class="section-title">⭐ Palpites Especiais</div>`;
    data.extras.forEach(ex => {
      const label = EXTRAS_MAP[ex.campo] || ex.campo;
      html += `
      <div class="extra-row">
        <div class="extra-label">${label}</div>
        <div class="extra-valor">${ex.valor || '—'}</div>
      </div>`;
    });
  }

  // Jogos por fase
  Object.keys(porFase).sort().forEach(fase => {
    html += `<div class="section-title">${fase}</div>`;
    porFase[fase].forEach(j => {
      const parts = j.id.split('_');
      const home = parts.slice(2, parts.length - 1).join(' ') || '?';
      const away = parts.slice(-(parts.length - 3)).join(' ') || '?';
      // tenta extrair time casa e fora do ID
      const idParts = j.id.replace(/^[A-L]_r\d_/, '').split('_');
      const homeTeam = idParts[0] || j.id;
      const awayTeam = idParts.slice(1).join(' ') || '';

      html += `
      <div class="jogo-row">
        <div class="team home">${homeTeam}</div>
        <div class="placar">${j.golsCasa} × ${j.golsFora}</div>
        <div class="team away">${awayTeam}</div>
      </div>`;
    });
  });

  container.innerHTML = html;
}
</script>
</body>
</html>
