<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Palpites — Bolão Copa 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde:#00A86B;--verde-escuro:#007A4D;--amarelo:#F5C518;
    --azul:#0D2137;--azul-medio:#163554;--branco:#F0F4F8;
    --cinza:#8A9BB0;--cinza-claro:#C8D6E5;--laranja:#FF6B35;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--azul);color:var(--branco);font-family:'Barlow',sans-serif;min-height:100vh;
    background-image:radial-gradient(ellipse at 20% 10%,rgba(0,168,107,.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(245,197,24,.08) 0%,transparent 50%);}
  header{background:linear-gradient(135deg,var(--verde-escuro) 0%,var(--azul-medio) 60%,var(--azul) 100%);border-bottom:3px solid var(--amarelo);padding:2rem 1.5rem;text-align:center;}
  .header-badge{display:inline-block;background:var(--amarelo);color:var(--azul);font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:3px;padding:4px 16px;border-radius:2px;margin-bottom:1rem;}
  header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,7vw,4rem);letter-spacing:4px;line-height:.9;}
  header h1 span{color:var(--amarelo);}
  header p{margin-top:.75rem;color:var(--cinza-claro);font-family:'Barlow Condensed',sans-serif;font-size:1rem;letter-spacing:1px;}
  main{max-width:820px;margin:0 auto;padding:2rem 1rem 4rem;}
  .search-box{background:var(--azul-medio);border:1px solid rgba(200,214,229,.15);border-radius:12px;padding:2rem;margin-bottom:2rem;}
  .search-box h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;margin-bottom:.5rem;color:var(--amarelo);}
  .search-box p{font-size:.88rem;color:var(--cinza);margin-bottom:1.25rem;}
  .search-row{display:flex;gap:12px;flex-wrap:wrap;}
  .search-row input{flex:1;min-width:200px;background:rgba(13,33,55,.8);border:1.5px solid rgba(200,214,229,.2);border-radius:6px;padding:12px 16px;color:var(--branco);font-family:'Barlow',sans-serif;font-size:1rem;outline:none;transition:border-color .2s;}
  .search-row input:focus{border-color:var(--verde);}
  .search-row input::placeholder{color:rgba(138,155,176,.45);}
  .btn-buscar{background:var(--verde);color:#fff;border:none;border-radius:6px;padding:12px 28px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:2px;cursor:pointer;transition:all .2s;white-space:nowrap;}
  .btn-buscar:hover{background:var(--verde-escuro);}
  .btn-buscar:disabled{opacity:.5;cursor:not-allowed;}
  .loading{text-align:center;padding:3rem;color:var(--cinza);font-family:'Barlow Condensed',sans-serif;}
  .loading .ball{font-size:2.5rem;display:inline-block;animation:bounce .8s infinite alternate;}
  @keyframes bounce{to{transform:translateY(-12px)}}
  .error-box{background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.3);border-radius:8px;padding:1.25rem;text-align:center;color:var(--laranja);font-family:'Barlow Condensed',sans-serif;font-size:1rem;}
  .result-header{background:var(--azul-medio);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;border:1px solid rgba(0,168,107,.25);}
  .result-nome{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;}
  .result-cod{font-family:'Barlow Condensed',sans-serif;font-size:.85rem;color:var(--cinza-claro);}
  .result-cod span{color:var(--amarelo);font-weight:700;}
  .stats-cards{display:flex;gap:12px;flex-wrap:wrap;}
  .stat-card{background:rgba(13,33,55,.6);border-radius:8px;padding:10px 18px;text-align:center;border:1px solid rgba(200,214,229,.1);min-width:80px;}
  .stat-val{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--amarelo);line-height:1;}
  .stat-lbl{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;color:var(--cinza);letter-spacing:1px;margin-top:2px;}
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:2px;color:var(--verde);margin:2rem 0 .75rem;display:flex;align-items:center;gap:.75rem;}
  .section-title::after{content:'';flex:1;height:1px;background:rgba(0,168,107,.2);}
  .jogo-card{background:var(--azul-medio);border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1.5px solid rgba(200,214,229,.08);}
  .jogo-card.acerto-total{border-color:rgba(0,168,107,.45);background:rgba(0,168,107,.06);}
  .jogo-card.acerto-parcial{border-color:rgba(245,197,24,.35);background:rgba(245,197,24,.04);}
  .jogo-card.sem-resultado{opacity:.65;}
  .jogo-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;}
  .team{font-family:'Barlow Condensed',sans-serif;font-size:.92rem;font-weight:700;}
  .team.home{text-align:right;}
  .team.away{text-align:left;}
  .placares-centro{display:flex;align-items:center;justify-content:center;gap:8px;}
  .placar-bloco{text-align:center;}
  .placar-label{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;letter-spacing:1px;color:var(--cinza);text-transform:uppercase;margin-bottom:2px;}
  .placar-valor{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;line-height:1;}
  .placar-valor.palpite{color:var(--amarelo);}
  .placar-valor.real{color:var(--branco);}
  .placar-valor.pendente{color:var(--cinza);font-size:1rem;}
  .placar-sep{width:1px;height:32px;background:rgba(200,214,229,.15);}
  .pts-badge{margin-top:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:1px;padding:3px 12px;border-radius:20px;display:inline-block;}
  .pts-8{background:rgba(0,168,107,.2);color:#5debb0;border:1px solid rgba(0,168,107,.3);}
  .pts-5{background:rgba(0,168,107,.12);color:var(--verde);border:1px solid rgba(0,168,107,.2);}
  .pts-3{background:rgba(245,197,24,.15);color:var(--amarelo);border:1px solid rgba(245,197,24,.25);}
  .pts-1{background:rgba(245,197,24,.08);color:#c9a600;border:1px solid rgba(245,197,24,.15);}
  .pts-0{background:rgba(255,107,53,.1);color:var(--laranja);border:1px solid rgba(255,107,53,.2);}
  .pts-pendente{background:rgba(138,155,176,.1);color:var(--cinza);border:1px solid rgba(138,155,176,.15);}
  .jogo-footer{display:flex;justify-content:center;margin-top:4px;}
  .extra-card{background:var(--azul-medio);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(200,214,229,.08);flex-wrap:wrap;}
  .extra-card.acerto{border-color:rgba(0,168,107,.35);background:rgba(0,168,107,.06);}
  .extra-left{flex:1;}
  .extra-label{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:1.5px;color:var(--cinza);text-transform:uppercase;}
  .extra-palpite{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;color:var(--branco);margin-top:2px;}
  .extra-real{font-family:'Barlow Condensed',sans-serif;font-size:.85rem;color:var(--cinza-claro);margin-top:2px;}
  .extra-real span{color:var(--amarelo);}
  .legenda{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:1.5rem;font-family:'Barlow Condensed',sans-serif;font-size:.78rem;color:var(--cinza);}
  .leg-item{display:flex;align-items:center;gap:6px;}
  .leg-dot{width:8px;height:8px;border-radius:50%;}
  .nav-link{display:inline-block;margin-top:2rem;color:var(--cinza);border:1.5px solid rgba(200,214,229,.2);border-radius:6px;padding:10px 24px;font-family:'Barlow Condensed',sans-serif;font-size:.9rem;letter-spacing:1.5px;cursor:pointer;transition:all .2s;text-decoration:none;}
  .nav-link:hover{color:var(--branco);border-color:rgba(200,214,229,.5);}
</style>
</head>
<body>
<header>
  <div class="header-badge">🔍 CONSULTA DE PALPITES</div>
  <h1>COPA DO MUNDO <span>2026</span></h1>
  <p>Veja seus palpites, o resultado real e sua pontuação</p>
</header>
<main>
  <div class="search-box">
    <h2>Buscar meus palpites</h2>
    <p>Digite o nome exatamente como cadastrou no bolão.</p>
    <div class="search-row">
      <input type="text" id="inputNome" placeholder="Seu nome no bolão..." onkeydown="if(event.key==='Enter') buscar()">
      <button class="btn-buscar" onclick="buscar()" id="btnBuscar">Buscar</button>
    </div>
  </div>
  <div id="resultado"></div>
  <a href="https://henriquefeldman.github.io/bolao2026/" class="nav-link">← Voltar ao Bolão</a>
</main>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbweLyhR_mUB0HH0kHiKsrfC64RH0YJkI2xtKjbCi3Nr-oLlb9NbBDu1yhg3nkjSfUFfgg/exec';
const EXTRAS_MAP = {extra_campeao:'🥇 Campeão',extra_vice:'🥈 Vice-Campeão',extra_terceiro:'🥉 Terceiro Colocado',extra_quarto:'4️⃣ Quarto Colocado',extra_artilheiro:'⚽ Artilheiro'};
 
function calcPts(palH,palA,realH,realA){
  palH=parseInt(palH);palA=parseInt(palA);realH=parseInt(realH);realA=parseInt(realA);
  if(isNaN(palH)||isNaN(palA)||isNaN(realH)||isNaN(realA)) return null;
  if(palH===realH&&palA===realA) return {pts:8,label:'Placar exato'};
  const palRes=palH>palA?'C':palA>palH?'F':'E';
  const realRes=realH>realA?'C':realA>realH?'F':'E';
  const acertouRes=palRes===realRes;
  const acertouCasa=palH===realH;
  const acertouFora=palA===realA;
  if(acertouRes&&(acertouCasa||acertouFora)) return {pts:5,label:'Vencedor + gols'};
  if(acertouRes) return {pts:3,label:'Acertou o vencedor'};
  if(acertouCasa||acertouFora) return {pts:1,label:'Acertou gols de um time'};
  return {pts:0,label:'Não pontuou'};
}
 
function calcPtsExtras(campo,palpite,resultados){
  const pal=palpite.trim().toLowerCase();
  const resCampeao=(resultados['campeao']||'').toLowerCase();
  const resVice=(resultados['vice']||'').toLowerCase();
  const resTerceiro=(resultados['terceiro']||'').toLowerCase();
  const resQuarto=(resultados['quarto']||'').toLowerCase();
  const resArtilheiro=(resultados['artilheiro']||'').toLowerCase();
  if(campo==='extra_artilheiro'){if(!resArtilheiro) return null;return pal===resArtilheiro?{pts:12,label:'Acertou o artilheiro'}:{pts:0,label:'Não pontuou'};}
  if(campo==='extra_campeao'){if(!resCampeao||!resVice) return null;if(pal===resCampeao) return {pts:10,label:'Acertou o Campeão'};if(pal===resVice) return {pts:6,label:'Time está na final'};return {pts:0,label:'Não pontuou'};}
  if(campo==='extra_vice'){if(!resCampeao||!resVice) return null;if(pal===resVice) return {pts:10,label:'Acertou o Vice'};if(pal===resCampeao) return {pts:6,label:'Time está na final'};return {pts:0,label:'Não pontuou'};}
  if(campo==='extra_terceiro'){if(!resTerceiro||!resQuarto) return null;if(pal===resTerceiro) return {pts:9,label:'Acertou o 3º lugar'};if(pal===resQuarto) return {pts:5,label:'Time está no 3º/4º'};return {pts:0,label:'Não pontuou'};}
  if(campo==='extra_quarto'){if(!resTerceiro||!resQuarto) return null;if(pal===resQuarto) return {pts:9,label:'Acertou o 4º lugar'};if(pal===resTerceiro) return {pts:5,label:'Time está no 3º/4º'};return {pts:0,label:'Não pontuou'};}
  return null;
}
 
function ptsBadge(pts){
  if(pts===null) return '<span class="pts-badge pts-pendente">Aguardando resultado</span>';
  if(pts.pts===8) return `<span class="pts-badge pts-8">+8 pts — ${pts.label}</span>`;
  if(pts.pts===5) return `<span class="pts-badge pts-5">+5 pts — ${pts.label}</span>`;
  if(pts.pts===3) return `<span class="pts-badge pts-3">+3 pts — ${pts.label}</span>`;
  if(pts.pts===1) return `<span class="pts-badge pts-1">+1 pt — ${pts.label}</span>`;
  return `<span class="pts-badge pts-0">0 pts — ${pts.label}</span>`;
}
 
function cardClass(pts){
  if(pts===null) return 'sem-resultado';
  if(pts.pts>=5) return 'acerto-total';
  if(pts.pts>=1) return 'acerto-parcial';
  return '';
}
 
async function buscar(){
  const nome=document.getElementById('inputNome').value.trim();
  if(!nome){alert('Digite seu nome!');return;}
  const btn=document.getElementById('btnBuscar');
  btn.disabled=true;btn.textContent='Buscando...';
  document.getElementById('resultado').innerHTML='<div class="loading"><div class="ball">⚽</div><br><br>Buscando palpites...</div>';
  try{
    const resp=await fetch(`${SCRIPT_URL}?action=consultar&nome=${encodeURIComponent(nome)}`);
    const data=await resp.json();
    renderResultado(data,nome);
  }catch(e){
    document.getElementById('resultado').innerHTML='<div class="error-box">⚠️ Erro ao buscar. Verifique sua conexão e tente novamente.</div>';
  }finally{btn.disabled=false;btn.textContent='Buscar';}
}
 
function renderResultado(data,nomeBuscado){
  const container=document.getElementById('resultado');
  if(!data.encontrado){
    container.innerHTML=`<div class="error-box">❌ Nenhum palpite encontrado para "<strong>${nomeBuscado}</strong>".<br><span style="font-size:.85rem;opacity:.8">Verifique se o nome está exatamente igual ao cadastrado.</span></div>`;
    return;
  }
  const resultados=data.resultados||{};
  let ptJogos=0, ptClassif=0, ptExtras=0, jogosComResultado=0;
 
  const jogosComPts=data.jogos.map(j=>{
    const res=resultados[j.id];
    let realH=null,realA=null;
    if(res){const p=res.split('-');if(p.length===2){realH=p[0];realA=p[1];}}
    const pts=(realH!==null)?calcPts(j.golsCasa,j.golsFora,realH,realA):null;
    if(pts!==null){ptJogos+=pts.pts;jogosComResultado++;}
    return {...j,realH,realA,pts};
  });
 
  const extrasComPts=data.extras.map(ex=>{
    const pts=calcPtsExtras(ex.campo,ex.valor,resultados);
    if(pts!==null&&pts.pts) ptExtras+=pts.pts;
    return {...ex,pts};
  });
 
  // Pontos de classificados
  const classificados = data.classificados || [];
  classificados.forEach(c => { if(c.pts) ptClassif += c.pts; });
 
  const totalPts = ptJogos + ptClassif + ptExtras;
 
  const porFase={};
  jogosComPts.forEach(j=>{
    const fase=j.aba||'Outros';
    if(!porFase[fase]) porFase[fase]=[];
    porFase[fase].push(j);
  });
 
  let html=`
  <div class="result-header">
    <div><div class="result-nome">${data.nome}</div><div class="result-cod">Grupo: <span>${data.codigos||'—'}</span></div></div>
    <div class="stats-cards">
      <div class="stat-card"><div class="stat-val">${totalPts}</div><div class="stat-lbl">total</div></div>
      <div class="stat-card"><div class="stat-val">${ptJogos}</div><div class="stat-lbl">jogos</div></div>
      <div class="stat-card"><div class="stat-val">${ptClassif}</div><div class="stat-lbl">classif.</div></div>
      <div class="stat-card"><div class="stat-val">${ptExtras}</div><div class="stat-lbl">extras</div></div>
    </div>
  </div>
  <div class="legenda">
    <div class="leg-item"><div class="leg-dot" style="background:var(--verde)"></div> Acerto total (5-8 pts)</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--amarelo)"></div> Acerto parcial (1-3 pts)</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--cinza)"></div> Aguardando resultado</div>
  </div>`;
 
  // Classificados dos grupos
  const classifComPts = classificados.filter(c => c.status === 'ok');
  const classifAguard = classificados.filter(c => c.status === 'aguardando');
  if(classifComPts.length > 0){
    html+=`<div class="section-title">🏅 Classificados dos Grupos</div>`;
    classifComPts.forEach(c=>{
      const cor = c.pts===4?'acerto-total':c.pts>=1?'acerto-parcial':'';
      html+=`
      <div class="jogo-card ${cor}">
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center">
          <div style="text-align:right">
            <div style="font-size:.65rem;color:var(--cinza);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px">PALPITE</div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem">${c.palPrimeiro} / ${c.palSegundo}</div>
          </div>
          <div style="text-align:center;font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--amarelo)">Grupo ${c.grupo}</div>
          <div style="text-align:left">
            <div style="font-size:.65rem;color:var(--cinza);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px">REAL</div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem">${c.realPrimeiro} / ${c.realSegundo}</div>
          </div>
        </div>
        <div class="jogo-footer">${ptsBadge({pts:c.pts,label:c.label||''})}</div>
      </div>`;
    });
    if(classifAguard.length>0){
      html+=`<div style="font-family:'Barlow Condensed',sans-serif;font-size:.8rem;color:var(--cinza);text-align:center;padding:.5rem 0">⏳ ${classifAguard.length} grupo(s) ainda aguardando resultado</div>`;
    }
  }
 
  if(extrasComPts.length>0){
    html+=`<div class="section-title">⭐ Palpites Especiais</div>`;
    extrasComPts.forEach(ex=>{
      const label=EXTRAS_MAP[ex.campo]||ex.campo;
      const resKey=ex.campo.replace('extra_','');
      const resReal=resultados[resKey]||'';
      const isAcerto=ex.pts&&ex.pts.pts>0;
      html+=`<div class="extra-card ${isAcerto?'acerto':''}">
        <div class="extra-left">
          <div class="extra-label">${label}</div>
          <div class="extra-palpite">${ex.valor||'—'}</div>
          ${resReal?`<div class="extra-real">Real: <span>${resReal}</span></div>`:'<div class="extra-real" style="color:var(--cinza)">Aguardando</div>'}
        </div>
        <div>${ex.pts!==null?ptsBadge(ex.pts):'<span class="pts-badge pts-pendente">Aguardando</span>'}</div>
      </div>`;
    });
  }
 
// Mapa de nomes dos jogos do mata-mata
const JOGOS_NOMES = {
  'r32_01':'África do Sul × Canadá','r32_02':'Brasil × Japão','r32_03':'Alemanha × Paraguai',
  'r32_04':'Holanda × Marrocos','r32_05':'Costa do Marfim × Noruega','r32_06':'França × Suécia',
  'r32_07':'México × Equador','r32_08':'Inglaterra × RD Congo','r32_09':'Bélgica × Senegal',
  'r32_10':'EUA × Bósnia-Herz.','r32_11':'Espanha × Áustria','r32_12':'Portugal × Croácia',
  'r32_13':'Suíça × Argélia','r32_14':'Austrália × Egito','r32_15':'Argentina × Cabo Verde',
  'r32_16':'Colômbia × Gana',
  'r16_01':'Canadá × Marrocos','r16_02':'Paraguai × França','r16_03':'Brasil × Noruega',
  'r16_04':'México × Inglaterra','r16_05':'Portugal × Espanha','r16_06':'EUA × Bélgica',
  'r16_07':'Argentina × Egito','r16_08':'Suíça × Colômbia',
  'qf_01':'França × Marrocos','qf_02':'Espanha × Bélgica','qf_03':'Noruega × Inglaterra','qf_04':'Argentina × Suíça',
  'sf_01':'Jogo 101','sf_02':'Jogo 102',
  'tp_01':'3º Lugar','fin_01':'Final'
};
 
  Object.keys(porFase).sort().forEach(fase=>{
    html+=`<div class="section-title">${fase}</div>`;
    porFase[fase].forEach(j=>{
      let homeTeam='', awayTeam='';
      // Fase de grupos — extrai do ID
      const grupoMatch = j.id.match(/^[a-l]_r\d_(.+)/i);
      if(grupoMatch) {
        const semGrupo = grupoMatch[1];
        const us = semGrupo.indexOf('_');
        homeTeam = us>-1 ? semGrupo.substring(0,us) : semGrupo;
        awayTeam = us>-1 ? semGrupo.substring(us+1) : '';
      } else {
        // Mata-mata — busca no mapa de nomes
        const nomeJogo = JOGOS_NOMES[j.id] || j.id;
        const partes = nomeJogo.split('×');
        homeTeam = partes[0]?.trim() || j.id;
        awayTeam = partes[1]?.trim() || '';
      }
      const temReal=j.realH!==null;
      html+=`<div class="jogo-card ${cardClass(j.pts)}">
        <div class="jogo-grid">
          <div class="team home">${homeTeam}</div>
          <div class="placares-centro">
            <div class="placar-bloco">
              <div class="placar-label">palpite</div>
              <div class="placar-valor palpite">${j.golsCasa} × ${j.golsFora}</div>
            </div>
            <div class="placar-sep"></div>
            <div class="placar-bloco">
              <div class="placar-label">real</div>
              ${temReal?`<div class="placar-valor real">${j.realH} × ${j.realA}</div>`:'<div class="placar-valor pendente">—</div>'}
            </div>
          </div>
          <div class="team away">${awayTeam}</div>
        </div>
        <div class="jogo-footer">${ptsBadge(j.pts)}</div>
      </div>`;
    });
  });
 
  container.innerHTML=html;
}
</script>
</body>
</html>
